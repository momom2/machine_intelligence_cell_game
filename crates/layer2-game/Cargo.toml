[package]
name = "layer2-game"
version = "0.1.0"
edition = "2021"
description = "Layer 2 — the real-time PLAYABLE macroquad renderer over the headless `cell-core` mean-field graph engine. The tactical (Solarmax-like) spectacle layer: a human plays seat A, a HIDDEN-mix `automaton` Automaton plays seat B. Honours the design's 'decouple computation from spectacle' principle — all model logic lives in `cell-core`/`automaton`; this crate only draws the graph/fleets and feeds the engine `Command`s. The headline experience: read the hidden mix and counter it; the true mix is revealed on the end screen (the glass-genome reward)."

[[bin]]
name = "layer2-game"
path = "src/main.rs"

[dependencies]
# The deterministic mean-field engine (the computation) and the hidden-mix Automaton
# opponent. macroquad (the spectacle) lives ONLY here, so `cell-core`/`automaton` stay
# dependency-free and bit-reproducible.
cell-core = { path = "../cell-core" }
automaton = { path = "../automaton" }
macroquad = "0.4.15"
