[package]
name = "world"
version = "0.1.0"
edition = "2021"
description = "Phase 1 — the Layer-2 LENS over multiple Layer-1 planets. 'ONE WORLD, Layer 2 is a lens': every planet IS a real `layer1::Structure` (sub-structures + discrete ships); Layer 2 is the zoomed-out view connecting planets by lanes, with fleets in transit. There is exactly ONE simulation substrate (the spatial Layer-1 sim) — this crate does NOT add a second combat model; it steps each planet's Structure and moves ships between planets along lanes. Deterministic, headless, fully tested; no graphics."

[lib]
name = "world"
path = "src/lib.rs"

# Built directly on the headless Layer-1 spatial sim. No other deps: like `layer1`,
# the world layer carries no external crates so the whole thing stays bit-reproducible
# (all randomness lives inside each planet's `layer1` Structure, behind its seeded PRNG).
[dependencies]
layer1 = { path = "../layer1" }
