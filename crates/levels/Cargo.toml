[package]
name = "levels"
version = "0.1.0"
edition = "2021"
description = "Phase 3 — the level/campaign system for v1 (pure-L1 since 2026-07-20). A headless, tested library of GUI-facing level metadata (title/blurb/objective/hints, the chosen enemy `ai::Roster` seats, whether basic automation is offered, and the match horizon) plus a `build(seed) -> layer1::Interior` board-builder per level (data-driven .lvl specs or built-in fns). The 7-level campaign is an authored curriculum, and a headless validation harness asserts every level builds without panic and is deterministic (balance is never tested — owner rule: balancing is per-level, by hand). No graphics."

[lib]
name = "levels"
path = "src/lib.rs"

# Built on the AI layer (`ai`, for the opponent roster + seat controllers) and the
# Layer-1 spatial sim (`layer1`, the whole game board since the pure-L1 pivot). Aside
# from the libm determinism exception below it carries ZERO external dependencies, so
# every level build + match replay is bit-reproducible.
[dependencies]
# REPLAY DETERMINISM (owner-approved zero-dep exception, 2026-07-10): every sim-relevant
# sin/cos/atan2 routes through this pure-Rust implementation so wasm and native produce
# bit-identical trajectories - a replay recorded in the browser replays exactly on desktop.
# Plain f32 arithmetic (+ - * / sqrt) is IEEE-exact everywhere and needs no help.
libm = "0.2"
ai = { path = "../ai" }
layer1 = { path = "../layer1" }
