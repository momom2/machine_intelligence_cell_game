[package]
name = "game"
version = "0.3.0"
edition = "2021"
description = "Phase 4 — the complete single-binary v1 cell-game RTS (pure-L1 since 2026-07-20). A macroquad GUI that assembles the headless substrate (`levels` campaign over `ai`/`layer1`) into a playable game: a main menu, sequential-unlock level select (progress persisted next to the exe), and the single-board match itself — one Layer-1 interior (sub-structures, ships, orbits, capture grinds) under a zoomable camera — with the `SeatController` enemy seats, fixed-tick pacing with render interpolation, victory/defeat/pause flow, replays (.mir v2 + the extended .mirx recorder/viewer), and the end-of-mission stats screen. Honours the design's 'decouple computation from spectacle' principle: all model logic lives in the headless crates; this crate only draws and turns input into orders. Carries headless verification flags (--shot/--screen/--level/--at-tick/--auto/--seed/--selftest/--snaptest) for screenshot-checkable builds."

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
# The headless substrate (the computation). macroquad (the spectacle) lives ONLY in the
# game/renderer crates, so the substrate crates stay dependency-free and bit-reproducible.
levels = { path = "../levels" }
ai = { path = "../ai" }
layer1 = { path = "../layer1" }
macroquad = "0.4.15"

[features]
# Sound needs an audio device (and libasound on Linux). It is always on for Windows, macOS and the
# browser (see build.rs); on Linux opt in with `--features sound`. Without a device the audio
# backend aborts the process, so headless machines must leave it off.
sound = ["macroquad/audio"]

[target.'cfg(any(windows, target_os = "macos", target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4.15", features = ["audio"] }
