[package]
name = "game"
version = "0.1.0"
edition = "2021"
description = "Phase 4 — the complete single-binary v1 cell-game RTS. A macroquad GUI that assembles the headless substrate (`levels` campaign over `world`/`ai`/`layer1`) into a playable game: a main menu, sequential-unlock level select (progress persisted next to the exe), and the zoomable two-layer match itself — a Layer-2 tactical lens (planets, lanes, inter-planet fleets) you can zoom into for the Layer-1 interior (sub-structures, ships, battle bubbles), with per-planet basic automation (the Layer-1 greedy adapter), an `AiController` enemy, fixed-tick pacing with render interpolation, and victory/defeat/pause flow. Honours the design's 'decouple computation from spectacle' principle: all model logic lives in the headless crates; this crate only draws and turns input into orders. Carries headless verification flags (--shot/--screen/--level/--view/--at-tick/--auto/--seed) for screenshot-checkable builds."

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
# The headless substrate (the computation). macroquad (the spectacle) lives ONLY in the
# game/renderer crates, so the substrate crates stay dependency-free and bit-reproducible.
levels = { path = "../levels" }
world = { path = "../world" }
ai = { path = "../ai" }
layer1 = { path = "../layer1" }
macroquad = "0.4.15"
