[package]
name = "ai"
version = "0.1.0"
edition = "2021"
description = "Phase 2 — the AI layer for v1 (pure-L1 since 2026-07-20). The GREEDY tactical policy (a small garrison floor; surplus retreats from a losing fight else expands to the nearest uncontested position) over the Layer-1 interior; the stateful campaign brains (the ledger-driven Simple colonizer, its adjacency-leashed variant, and the scripted Cycler drillmaster), each a legible hand-written policy with a documented blind spot; a roster + `SeatController` dispatch that hosts step per enemy seat; plus a headless AI-vs-AI harness. Deterministic, headless, fully tested."

[lib]
name = "ai"
path = "src/lib.rs"

# The headless verification artifact: runs two roster entries head-to-head on a test
# world to a horizon and prints the outcome (greedy-seam demo + the pure-strategy cycle).
# The Counter diagnostic (COUNTER_DESIGN §7): runs Roster::Counter vs each of the four
# targets, sweeping the p_max playstyle dial, both seatings, several seeds; prints the
# inferred-vs-truth read, the win-rate, and the converged backbone/exploit per cell.

# Built on the Layer-1 spatial sim. Like the rest of the workspace it carries ZERO
# external dependencies: all randomness lives inside the `layer1` Interior behind its
# seeded PRNG, so every run is bit-reproducible.
[dependencies]
layer1 = { path = "../layer1" }
